# Render blueprint — provisions a free web service for the backend.
# Database is managed externally on Neon (https://neon.tech) — paste the
# Neon connection string into DATABASE_URL when prompted by Render.
# Frontend is deployed separately on Vercel.
#
# To use: in Render dashboard → New + → Blueprint → connect this repo.

services:
  - type: web
    name: realtime-intelligence-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev forces devDependencies (@types/*, prisma, typescript) to be
    # installed even though Render sets NODE_ENV=production during the build.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Set these manually in the Render dashboard / blueprint prompt:
      - key: DATABASE_URL
        sync: false         # paste the Neon connection string
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: FRONTEND_URL
        sync: false         # set to your Vercel URL after frontend is deployed
      - key: WHISPER_PROVIDER
        value: openai
      - key: WHISPER_API_URL
        value: https://api.openai.com
      - key: WHISPER_MODEL
        value: whisper-1
      - key: WHISPER_API_KEY
        sync: false         # your OpenAI API key
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: VECTOR_STORE_PATH
        value: ./vectorstore
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: UPLOAD_DIR
        value: ./uploads
      - key: LOG_LEVEL
        value: info
