# Render blueprint — provisions a free Postgres database and a free web service
# for the backend. Frontend is deployed separately on Vercel.
#
# To use: in Render dashboard → New + → Blueprint → connect this repo.

databases:
  - name: realtime-intelligence-db
    plan: free
    databaseName: realtime_intelligence
    user: postgres

services:
  - type: web
    name: realtime-intelligence-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000        # Render assigns 10000 for free web services
      - key: DATABASE_URL
        fromDatabase:
          name: realtime-intelligence-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render auto-generates a strong random value
      # Set these manually in the Render dashboard after the first deploy:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: FRONTEND_URL
        sync: false         # set to your Vercel URL after frontend is deployed
      - key: WHISPER_PROVIDER
        value: openai
      - key: WHISPER_API_URL
        value: https://api.openai.com
      - key: WHISPER_MODEL
        value: whisper-1
      - key: WHISPER_API_KEY
        sync: false         # your OpenAI API key
      - key: EMBEDDING_MODEL
        value: Xenova/all-MiniLM-L6-v2
      - key: VECTOR_STORE_PATH
        value: ./vectorstore
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: UPLOAD_DIR
        value: ./uploads
      - key: LOG_LEVEL
        value: info
